<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>記帳小幫手 | 歡迎</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #4e54c8 0%, #8f94fb 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.15);
            padding: 50px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            max-width: 400px;
            width: 90%;
            animation: fadeIn 1s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        h1 { margin-bottom: 15px; font-size: 2.8em; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
        p { margin-bottom: 40px; font-size: 1.2em; opacity: 0.95; line-height: 1.6; }
        .btn {
            display: inline-block;
            background: white;
            color: #4e54c8;
            padding: 15px 45px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2em;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            background: #f8f9fa;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 記帳小幫手</h1>
        <p>輕鬆管理個人收支<br>無縫同步團體帳務</p>
        <a href="system.html" class="btn">開始記帳 ➜</a>
    </div>
</body>
</html>
